<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shoe Vault - プライベートコレクション</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Permanent+Marker&display=swap');
        
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        
        /* テーマ変数 */
        .theme-default { 
            --primary: #6366f1; 
            --bg: #fdfeff; 
            --card: #ffffff; 
            --text-main: #1e293b; 
            --text-muted: #64748b;
            --input-bg: #f1f5f9;
            --border: #e2e8f0;
        }
        .theme-dark { 
            --primary: #818cf8; 
            --bg: #0f172a; 
            --card: #1e293b; 
            --text-main: #f1f5f9; 
            --text-muted: #94a3b8;
            --input-bg: #334155;
            --border: #334155;
        }
        .theme-street { 
            --primary: #fb7185; 
            --bg: #000000; 
            --card: #111111; 
            --text-main: #ffffff; 
            --text-muted: #a1a1aa;
            --input-bg: #27272a;
            --border: #3f3f46;
        }
        
        body { background-color: var(--bg); color: var(--text-main); }
        .marker-font { font-family: 'Permanent Marker', cursive; }
        .shoe-card { background-color: var(--card); border: 1px solid var(--border); }
        .input-style { background-color: var(--input-bg); color: var(--text-main); border: 1px solid var(--border); }
        .label-style { color: var(--text-muted); font-weight: 700; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        
        .shoe-img { transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .card-hover:hover .shoe-img { transform: scale(1.08) rotate(2deg); }
    </style>
</head>
<body id="app-body" class="theme-default min-h-screen pb-12">

    <!-- Header -->
    <header class="border-b border-slate-200/10 sticky top-0 z-50 backdrop-blur-md bg-[var(--bg)]/80">
        <div class="max-w-6xl mx-auto px-6 h-20 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-xl shadow-lg shadow-indigo-500/20">
                    <i data-lucide="layers" class="text-white w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight marker-font">My Shoe Vault</h1>
                    <p class="text-[10px] font-bold opacity-50 uppercase tracking-widest">Private Collection</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="flex bg-slate-200/30 p-1 rounded-xl">
                    <button onclick="setTheme('default')" class="p-2 rounded-lg hover:bg-white transition-all"><i data-lucide="sun" class="w-4 h-4"></i></button>
                    <button onclick="setTheme('dark')" class="p-2 rounded-lg hover:bg-white transition-all"><i data-lucide="moon" class="w-4 h-4"></i></button>
                    <button onclick="setTheme('street')" class="p-2 rounded-lg hover:bg-white transition-all"><i data-lucide="zap" class="w-4 h-4"></i></button>
                </div>
                <div id="auth-indicator" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-500 text-xs font-bold">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                    SECURE
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 lg:p-10 grid gap-10 lg:grid-cols-[360px_1fr]">
        <!-- Registration Section -->
        <aside class="space-y-8">
            <section class="shoe-card p-8 rounded-[2.5rem] shadow-2xl shadow-indigo-500/5 relative overflow-hidden">
                <h2 class="text-xl font-black mb-6 flex items-center gap-2">
                    <i data-lucide="plus" class="text-indigo-500"></i> 新しい靴を登録
                </h2>
                <form id="shoe-form" class="space-y-5">
                    <div class="space-y-2">
                        <label class="label-style">モデル名</label>
                        <input type="text" id="shoe-name" placeholder="Air Max 95" required
                            class="input-style w-full p-4 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all placeholder:opacity-30">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="label-style">ブランド</label>
                            <input type="text" id="shoe-brand" placeholder="Nike" required
                                class="input-style w-full p-4 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all placeholder:opacity-30">
                        </div>
                        <div class="space-y-2">
                            <label class="label-style">購入価格</label>
                            <input type="number" id="shoe-price" placeholder="18000" required
                                class="input-style w-full p-4 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all placeholder:opacity-30">
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="label-style">画像URL (任意)</label>
                        <input type="url" id="shoe-image" placeholder="https://..." 
                            class="input-style w-full p-4 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all placeholder:opacity-30">
                    </div>
                    <button type="submit" id="submit-btn" class="w-full py-5 bg-indigo-600 text-white font-black rounded-2xl hover:bg-indigo-700 shadow-xl shadow-indigo-500/30 active:scale-95 transition-all text-sm tracking-widest">
                        COLLECTIONに追加
                    </button>
                </form>
            </section>

            <!-- Wallet/Stats Card -->
            <div class="bg-indigo-600 p-8 rounded-[2.5rem] text-white shadow-xl relative overflow-hidden">
                <div class="relative z-10">
                    <div class="flex items-center justify-between opacity-80 mb-2">
                        <span class="text-xs font-bold uppercase tracking-widest">Estimated Value</span>
                        <i data-lucide="info" class="w-4 h-4"></i>
                    </div>
                    <div id="total-value" class="text-4xl font-black tracking-tighter">¥0</div>
                    <div class="mt-8 flex items-center gap-3">
                        <div id="shoe-count" class="bg-black/20 px-4 py-1.5 rounded-full text-xs font-black">0 Items</div>
                        <p class="text-[10px] font-bold opacity-60">Personal Portfolio</p>
                    </div>
                </div>
                <i data-lucide="wallet" class="absolute -bottom-6 -right-6 w-32 h-32 text-white/10 -rotate-12"></i>
            </div>
        </aside>

        <!-- Gallery Section -->
        <section class="space-y-8">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-6">
                <h2 class="text-3xl font-black tracking-tight marker-font">My Gallery</h2>
                <div class="relative group">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4 group-focus-within:text-indigo-500 transition-colors"></i>
                    <input type="text" id="search-input" placeholder="コレクションを検索..." 
                        class="input-style w-full sm:w-80 pl-12 pr-6 py-4 rounded-full text-sm outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm transition-all">
                </div>
            </div>

            <div id="shoe-list" class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Initial State -->
                <div class="col-span-full py-40 text-center flex flex-col items-center justify-center">
                    <div class="w-16 h-16 bg-slate-200/20 rounded-full flex items-center justify-center animate-pulse mb-4">
                        <i data-lucide="refresh-cw" class="w-8 h-8 text-indigo-500 animate-spin"></i>
                    </div>
                    <p id="status-text" class="text-slate-400 font-bold">データを同期中...</p>
                </div>
            </div>
        </section>
    </main>

    <script src="./config.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const body = document.getElementById('app-body');
        const listContainer = document.getElementById('shoe-list');
        const statusText = document.getElementById('status-text');

        window.setTheme = (theme) => {
            body.className = `theme-${theme} min-h-screen pb-12`;
            localStorage.setItem('shoe-vault-theme', theme);
            lucide.createIcons();
        };
        const savedTheme = localStorage.getItem('shoe-vault-theme');
        if(savedTheme) setTheme(savedTheme);

        async function initApp() {
            const config = window.myAppConfig || (window.__firebase_config ? JSON.parse(window.__firebase_config) : null);
            if (!config || !config.apiKey) {
                statusText.innerHTML = "Error: config.jsが見つかりません。";
                return;
            }

            const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'my-shooze-picup';
            const app = initializeApp(config);
            const auth = getAuth(app);
            const db = getFirestore(app);

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    setupPrivateData(db, appId, user.uid);
                } else {
                    await signInAnonymously(auth);
                }
            });

            function setupPrivateData(db, appId, userId) {
                // 【重要】パスを個人専用の /users/{userId}/shoes に変更
                const userShoesRef = collection(db, 'artifacts', appId, 'users', userId, 'shoes');
                
                onSnapshot(userShoesRef, (snapshot) => {
                    const shoes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    render(shoes, db, appId, userId);
                }, (error) => {
                    console.error(error);
                    statusText.textContent = "アクセス権限エラーが発生しました。";
                });

                // フォーム送信
                document.getElementById('shoe-form').onsubmit = async (e) => {
                    e.preventDefault();
                    const btn = document.getElementById('submit-btn');
                    const name = document.getElementById('shoe-name').value;
                    const brand = document.getElementById('shoe-brand').value;
                    const price = Number(document.getElementById('shoe-price').value);
                    const imageUrl = document.getElementById('shoe-image').value;

                    try {
                        btn.disabled = true;
                        btn.textContent = "SAVING...";
                        await addDoc(userShoesRef, {
                            name, brand, purchasePrice: price,
                            imageUrl: imageUrl || null,
                            createdAt: serverTimestamp(),
                            marketValue: Math.floor(price * (0.85 + Math.random() * 0.45))
                        });
                        e.target.reset();
                    } catch (err) { alert("保存できませんでした: " + err.message); }
                    finally { btn.disabled = false; btn.textContent = "COLLECTIONに追加"; }
                };

                // 削除機能
                window.deleteShoe = async (id) => {
                    if(confirm("このアイテムを削除してもよろしいですか？")) {
                        await deleteDoc(doc(db, 'artifacts', appId, 'users', userId, 'shoes', id));
                    }
                };

                // 検索
                document.getElementById('search-input').oninput = (e) => {
                    const term = e.target.value.toLowerCase();
                    const filtered = window.allShoesCache.filter(s => 
                        s.name.toLowerCase().includes(term) || s.brand.toLowerCase().includes(term)
                    );
                    render(filtered, db, appId, userId, true);
                };
            }
        }

        function render(shoes, db, appId, userId, isSearch = false) {
            if(!isSearch) window.allShoesCache = shoes;
            
            const countEl = document.getElementById('shoe-count');
            const totalEl = document.getElementById('total-value');
            
            if (shoes.length === 0) {
                listContainer.innerHTML = `
                    <div class="col-span-full py-40 text-center border-2 border-dashed border-slate-500/20 rounded-[3rem]">
                        <p class="text-slate-400 font-bold">コレクションがまだありません</p>
                    </div>`;
                countEl.textContent = "0 Items";
                totalEl.textContent = "¥0";
                lucide.createIcons();
                return;
            }

            let total = 0;
            const sorted = [...shoes].sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            
            listContainer.innerHTML = sorted.map(s => {
                total += (s.marketValue || 0);
                const date = s.createdAt ? new Date(s.createdAt.seconds * 1000).toLocaleDateString() : 'New';
                const img = s.imageUrl 
                    ? `<img src="${s.imageUrl}" class="shoe-img w-full h-56 object-cover rounded-[2rem] shadow-lg" onerror="this.src='https://placehold.jp/24/6366f1/ffffff/400x400.png?text=NO+IMAGE'">`
                    : `<div class="w-full h-56 bg-indigo-500/5 rounded-[2rem] flex items-center justify-center"><i data-lucide="image" class="w-12 h-12 opacity-20"></i></div>`;

                return `
                    <div class="shoe-card p-6 rounded-[2.5rem] shadow-xl group card-hover relative transition-all">
                        <div class="relative overflow-hidden rounded-[2rem] mb-6">
                            ${img}
                            <button onclick="deleteShoe('${s.id}')" class="absolute top-4 right-4 p-3 bg-white/90 dark:bg-slate-800/90 text-red-500 rounded-2xl opacity-0 group-hover:opacity-100 transition-all hover:scale-110 shadow-xl">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-[10px] font-black text-indigo-500 uppercase tracking-widest mb-1">${escapeHtml(s.brand)}</p>
                                <h3 class="text-xl font-black tracking-tight leading-tight">${escapeHtml(s.name)}</h3>
                            </div>
                            <div class="text-right">
                                <p class="text-[10px] font-bold opacity-40 uppercase tracking-tighter">Est. Value</p>
                                <p class="text-lg font-black text-emerald-500 tracking-tighter">¥${(s.marketValue || 0).toLocaleString()}</p>
                            </div>
                        </div>
                        <div class="mt-6 pt-5 border-t border-slate-500/10 flex items-center justify-between text-[10px] font-bold opacity-40">
                            <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${date}</span>
                            <span class="uppercase tracking-widest">Authenticated</span>
                        </div>
                    </div>`;
            }).join('');
            
            lucide.createIcons();
            if(!isSearch) {
                countEl.textContent = `${shoes.length} Items`;
                totalEl.textContent = `¥${total.toLocaleString()}`;
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        window.onload = initApp;
    </script>
</body>
</html>
