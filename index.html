<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoe Stock - コレクション管理</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 p-1.5 rounded-lg">
                    <i data-lucide="footprints" class="text-white"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-800">Shoe Stock</h1>
            </div>
            <div class="flex items-center gap-3">
                <div class="hidden sm:flex flex-col items-end">
                    <span class="text-xs text-slate-500 font-medium">ステータス</span>
                    <span id="user-status" class="text-sm font-bold text-slate-700">準備中...</span>
                </div>
                <div class="bg-slate-100 p-2 rounded-full">
                    <i data-lucide="user" class="text-slate-600"></i>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 md:p-8 grid gap-8 md:grid-cols-[320px_1fr]">
        <!-- 左側：登録フォーム -->
        <aside class="space-y-6">
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="text-indigo-600"></i> 新規登録
                </h2>
                <form id="shoe-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">モデル名</label>
                        <input type="text" id="shoe-name" placeholder="Air Force 1 '07" required
                            class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 transition-all outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">ブランド</label>
                        <input type="text" id="shoe-brand" placeholder="Nike" required
                            class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 transition-all outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">購入価格 (¥)</label>
                        <input type="number" id="shoe-price" placeholder="12100" required
                            class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 transition-all outline-none">
                    </div>
                    <button type="submit" id="submit-btn" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 shadow-md shadow-indigo-100 transition-all active:scale-[0.98]">
                        コレクションに追加
                    </button>
                </form>
            </section>

            <!-- 合計統計カード -->
            <section class="bg-indigo-900 text-white p-6 rounded-2xl shadow-lg">
                <p class="text-indigo-300 text-sm font-medium">合計評価額</p>
                <div id="total-value" class="text-2xl font-bold mt-1">¥0</div>
                <div class="mt-4 flex items-center gap-2 text-xs text-indigo-200">
                    <i data-lucide="trending-up" style="width: 14px; height: 14px;"></i>
                    <span>市場価値をリアルタイム反映中</span>
                </div>
            </section>
        </aside>

        <!-- 右側：リスト表示 -->
        <section class="space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <h2 class="text-xl font-bold text-slate-800">
                    My Collection <span id="shoe-count" class="text-indigo-600 ml-1">0</span>
                </h2>
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" style="width: 18px; height: 18px;"></i>
                    <input type="text" id="search-input" placeholder="検索..." 
                        class="w-full sm:w-64 pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-full text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                </div>
            </div>

            <div id="shoe-list" class="grid gap-4">
                <div id="status-container" class="text-center py-24 bg-white rounded-3xl border-2 border-dashed border-slate-200">
                    <div id="loading-spinner" class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600 mx-auto mb-4"></div>
                    <p id="status-text" class="text-slate-400 font-medium">Firebase 接続中...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- config.js の読み込み -->
    <script src="./config.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const userStatusEl = document.getElementById('user-status');
        const statusText = document.getElementById('status-text');
        const shoeListContainer = document.getElementById('shoe-list');
        const spinner = document.getElementById('loading-spinner');

        // アプリケーションの初期化
        async function initApp() {
            // config.js が読み込まれているかチェック
            const config = window.myAppConfig || (window.__firebase_config ? JSON.parse(window.__firebase_config) : null);

            if (!config || !config.apiKey) {
                userStatusEl.textContent = "設定なし";
                statusText.innerHTML = `<span class="text-red-500 font-bold">【設定エラー】</span><br>config.js が正しく読み込まれていません。`;
                spinner.classList.add('hidden');
                return;
            }

            try {
                const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'my-shooze-picup';
                const app = initializeApp(config);
                const auth = getAuth(app);
                const db = getFirestore(app);

                let allShoes = [];
                lucide.createIcons();

                // 認証の監視
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        userStatusEl.textContent = "接続済み";
                        setupDataListener(db, appId);
                    } else {
                        try {
                            await signInAnonymously(auth);
                        } catch (err) {
                            console.error("Auth error:", err);
                            userStatusEl.textContent = "接続失敗";
                            statusText.textContent = "匿名認証が無効です。";
                        }
                    }
                });

                // Firestore データのリアルタイム監視
                function setupDataListener(db, appId) {
                    const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'shoes'));
                    onSnapshot(q, (snapshot) => {
                        allShoes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        renderShoes(allShoes);
                    }, (error) => {
                        console.error("Firestore Error:", error);
                        statusText.innerHTML = `<span class="text-red-500 font-bold">【アクセス拒否】</span><br>Firebaseのルールを確認してください。`;
                    });
                }

                // フォーム送信
                document.getElementById('shoe-form').onsubmit = async (e) => {
                    e.preventDefault();
                    if (!auth.currentUser) return;

                    const name = document.getElementById('shoe-name').value;
                    const brand = document.getElementById('shoe-brand').value;
                    const price = Number(document.getElementById('shoe-price').value);
                    const btn = document.getElementById('submit-btn');

                    try {
                        btn.disabled = true;
                        btn.textContent = "保存中...";
                        
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'shoes'), {
                            name, brand, purchasePrice: price,
                            userId: auth.currentUser.uid,
                            userName: `User_${auth.currentUser.uid.slice(0, 4)}`,
                            createdAt: serverTimestamp(),
                            marketValue: Math.floor(price * (0.9 + Math.random() * 0.5)) // 擬似市場価値
                        });
                        
                        e.target.reset();
                    } catch (err) {
                        alert("エラーが発生しました: " + err.message);
                    } finally {
                        btn.disabled = false;
                        btn.textContent = "コレクションに追加";
                    }
                };

                // 検索機能
                document.getElementById('search-input').oninput = (e) => {
                    const term = e.target.value.toLowerCase();
                    const filtered = allShoes.filter(s => 
                        s.name.toLowerCase().includes(term) || 
                        s.brand.toLowerCase().includes(term)
                    );
                    renderShoes(filtered);
                };

            } catch (err) {
                console.error("Initialization Error:", err);
                statusText.textContent = "アプリの起動中にエラーが発生しました。";
            }
        }

        // リスト描画
        function renderShoes(shoes) {
            const countEl = document.getElementById('shoe-count');
            const totalEl = document.getElementById('total-value');
            
            if (shoes.length === 0) {
                shoeListContainer.innerHTML = `
                    <div class="text-center py-24 bg-white rounded-3xl border-2 border-dashed border-slate-200">
                        <i data-lucide="footprints" class="text-slate-300 mx-auto mb-4" style="width:40px; height:40px;"></i>
                        <p class="text-slate-400 font-medium">コレクションは空です</p>
                    </div>`;
                lucide.createIcons();
                countEl.textContent = "0";
                totalEl.textContent = "¥0";
                return;
            }

            let total = 0;
            shoeListContainer.innerHTML = shoes.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).map(s => {
                const val = s.marketValue || 0;
                total += val;
                return `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between hover:shadow-md transition-shadow">
                        <div class="flex items-center gap-3">
                            <div class="p-2 bg-indigo-50 rounded-lg"><i data-lucide="footprints" class="text-indigo-500"></i></div>
                            <div>
                                <h3 class="font-bold">${escapeHtml(s.name)}</h3>
                                <p class="text-xs text-slate-500">${escapeHtml(s.brand)}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-emerald-600">¥${val.toLocaleString()}</div>
                        </div>
                    </div>`;
            }).join('');
            
            lucide.createIcons();
            countEl.textContent = shoes.length;
            totalEl.textContent = `¥${total.toLocaleString()}`;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ページ読み込み完了後に開始
        window.addEventListener('load', initApp);
    </script>
</body>
</html>
